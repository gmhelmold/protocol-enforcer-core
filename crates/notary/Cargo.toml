[package]
name = "protocol-notary"
version.workspace = true
license.workspace = true
edition.workspace = true
repository.workspace = true
authors.workspace = true
rust-version.workspace = true
description = "Ed25519 transcript-root witness signing and human-approval gate primitives for the Protocol Enforcer."
keywords = ["ed25519", "signing", "merkle"]
categories = ["cryptography"]

[lib]
name = "protocol_notary"
path = "src/lib.rs"

[[bin]]
name = "notary-sign"
path = "src/bin/notary_sign.rs"

[[bin]]
name = "notary-keygen"
path = "src/bin/notary_keygen.rs"

[dependencies]
protocol-ledger = { path = "../ledger" }
protocol-types = { path = "../types" }
ed25519-dalek = { workspace = true }
sha2 = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
getrandom = { workspace = true }
clap = { workspace = true }

[dev-dependencies]
tempfile = { workspace = true }
