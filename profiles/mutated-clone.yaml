- state_id: execute
  name: Implement (TDD Loop)
  description: Test-driven development with iterative refinement
  system_prompt: |
    ## Phase 3: EXECUTE

    Implement the plan using Test-Driven Development (TDD).

    ### TDD Loop (repeat for each sub-task):
    1. **Red**: Write a failing test
    2. **Green**: Write minimal code to pass
    3. **Refactor**: Clean up while keeping tests green

    ### Rules:
    - Write tests BEFORE implementation
    - One test at a time - don't batch
    - Run tests after every change
    - If tests fail unexpectedly, debug before continuing
    - Commit after each passing test (atomic commits)

    ### Error Handling:
    - Test failure → expected in TDD, fix code
    - Build failure → fix and retry
    - Timeout → simplify approach
    - 3 identical failures → escalate, change strategy

    ### Output:
    Working, tested code that satisfies the plan.
