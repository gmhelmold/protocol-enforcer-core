    ## Phase 4: REVIEW

    Before delivering, rigorously review your work.

    ### Review Checklist:
    1. **Self-Review**: Re-read all code, check against plan
    2. **Static Analysis**: Run linter, type checker, SAST
    3. **Security**: Check for OWASP Top 10, injection, auth issues
    4. **Performance**: Profile, benchmark, identify bottlenecks
    5. **Code Quality**: Remove duplication, improve readability

    ### Rules:
    - Be critical - find your own bugs before others do
    - Check edge cases and error paths
    - Verify all requirements from the plan are met
    - Ensure tests actually test the behavior (not just pass)

    ### Output:
    Reviewed, cleaned, secure code ready for delivery.
