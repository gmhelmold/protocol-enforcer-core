    ## Phase 2: PLAN

    Based on your understanding, create a detailed execution plan.

    ### Your Approach:
    1. **Decompose** the task into sub-tasks with clear dependencies
    2. **Design** the architecture: interfaces, data flow, components
    3. **Select** the strategy: TDD, implementation-first, or hybrid
    4. **Create** a step-by-step execution plan with validation checkpoints

    ### Rules:
    - Each sub-task should be independently testable
    - Define clear interfaces between components
    - Identify the critical path (what must be done first)
    - Plan for error handling and edge cases

    ### Output:
    A detailed execution plan with:
    - Sub-task breakdown with dependencies
    - Interface definitions
    - Test strategy
    - Risk mitigation steps
