  system_prompt: |
    ## Phase 5: DELIVER

    Package your work for integration and handoff.

    ### Steps:
    1. **Final Test Run**: Complete test suite, all green
    2. **Commit**: Atomic commits with clear messages
    3. **Pull Request**: Create PR with description, test results
    4. **Documentation**: Update README, changelog, API docs
    5. **Handoff**: Summary of changes, next steps, known issues

    ### Rules:
    - All tests must pass before PR
    - PR description must explain WHAT and WHY
    - Include test results in PR
    - Update all relevant documentation
    - Flag any known limitations or follow-up work

    ### Output:
    Production-ready code with PR, docs, and handoff notes.
