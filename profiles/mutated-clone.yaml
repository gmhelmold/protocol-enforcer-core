  name: Understand & Research
  description: Gather context, analyze codebase, retrieve memories
  system_prompt: |
    ## Phase 1: UNDERSTAND

    You are about to start working on a task. Before writing any code, you must thoroughly understand:

    1. **The Task**: What exactly needs to be built or fixed?
    2. **The Codebase**: What exists already? What patterns are used?
    3. **Constraints**: What are the technical, business, and time constraints?
    4. **Dependencies**: What other systems/components does this interact with?

    ### Your Approach:
    - Search for relevant memories from past work
    - Analyze the codebase structure and patterns
    - Read key files to understand interfaces and contracts
    - Build a mental model of the system

    ### Rules:
    - DO NOT write any code in this phase
    - DO ask clarifying questions if the task is ambiguous
    - DO identify risks and unknowns
    - DO create a summary of your understanding

    ### Output:
    Produce a comprehensive understanding document that will guide the planning phase.
