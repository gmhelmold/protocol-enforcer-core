[workspace]
resolver = "2"
members = [
    "crates/types",
    "crates/library",
    "crates/manifest",
    "crates/ledger",
    "crates/artifacts",
    "crates/fsm",
    "crates/contract",
    "crates/gateway",
    "crates/notary",
]

[workspace.package]
version = "0.1.1"
edition = "2021"
license = "Apache-2.0"
repository = "https://github.com/gmhelmold/protocol-enforcer-core"
authors = ["Gustavo Schneiter"]
rust-version = "1.80"

[workspace.dependencies]
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
serde_yaml = "0.9"
thiserror = "1.0"
chrono = { version = "0.4", features = ["serde"] }
uuid = { version = "=1.6.0", features = ["serde", "v4"] }
getrandom = "=0.2.11"
indexmap = "1.9"
tokio = { version = "=1.53.1", features = ["fs", "macros", "rt", "io-util"] }
sha2 = "0.10"
mime_guess = "2.0"
schemars = "1.2"
# default-features disabled (security-audit FIX 4): the passive served path uses
# only static Draft-7 validation (`jsonschema::options().with_draft(Draft7)`), so
# the default `resolve-http`/`resolve-async` features — which drag a full
# reqwest HTTP/TLS stack in — are dead weight and attack surface on that path.
jsonschema = { version = "0.49", default-features = false }
clap = { version = "=4.3.24", features = ["derive", "env"] }
tempfile = "3.0"
pathdiff = "0.2"
rmcp = { version = "3.1.2", default-features = false }
tracing = "0.1"
ed25519-dalek = "=2.1.1"

[workspace.lints.rust]
unused_crate_dependencies = "warn"

[profile.dev]
opt-level = 0
debug = true

[profile.release]
opt-level = 3
debug = false
lto = true
